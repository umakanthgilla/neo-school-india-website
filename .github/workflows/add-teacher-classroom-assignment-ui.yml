name: Add Teacher Classroom Assignment UI

on:
  push:
    paths:
      - '.github/workflows/add-teacher-classroom-assignment-ui.yml'
      - 'scripts/add-teacher-classroom-assignment-ui.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch School Portal teacher assignment UI
        run: python3 scripts/add-teacher-classroom-assignment-ui.py

      - name: Validate School Portal JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('schools.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>',html)
          Path('/tmp/schools-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/schools-inline.js

      - name: Commit product change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schools.html
          if git diff --cached --quiet; then
            echo 'Teacher assignment UI already applied.'
          else
            git commit -m 'Add existing teacher classroom assignment control'
            git push origin HEAD:main
          fi
