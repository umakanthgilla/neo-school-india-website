name: Fix Stage Quote

on:
  push:
    paths:
      - '.github/workflows/fix-stage-quote.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Worker quote
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker/neo-lead-crm-api-worker-transport-phase1.js')
          s=p.read_text()
          bad="fail('Choose whether Playgroup was completed or this is the child's first school stage.');"
          good='fail("Choose whether Playgroup was completed or this is the child\'s first school stage.");'
          if bad not in s:
              raise SystemExit('Expected quote bug not found')
          p.write_text(s.replace(bad,good,1))
          PY
      - name: Validate Worker
        run: node --check worker/neo-lead-crm-api-worker-transport-phase1.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/neo-lead-crm-api-worker-transport-phase1.js
          git commit -m 'Fix student stage validation quote'
          git push origin HEAD:main
      - name: Package Worker
        run: |
          mkdir -p package
          cp worker/neo-lead-crm-api-worker-transport-phase1.js package/
          cat > package/README.txt <<'EOF'
          Neo School India latest Worker.
          Syntax-validated fix for student previous-stage history rules.
          Replace code only in the existing Cloudflare Worker neo-lead-crm-api.
          Do not create a new Worker or D1 database.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: NEO_LATEST_WORKER_STAGE_HISTORY_FIXED
          path: package/
          retention-days: 1
