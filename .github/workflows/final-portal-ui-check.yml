name: Final Portal UI Check

on:
  push:
    paths:
      - '.github/workflows/final-portal-ui-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate JavaScript
        run: |
          node --check bulk-upload-plus.js
          node --check handover-ui-cleanup.js
          node --check password-access.js
      - name: Refresh school portal loader cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('schools.html')
          s=p.read_text()
          old='/password-access.js?v=6'
          new='/password-access.js?v=7'
          if old in s:
              p.write_text(s.replace(old,new,1))
          elif new not in s:
              raise SystemExit('password-access loader marker not found')
          PY
      - name: Commit cache refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schools.html
          if git diff --cached --quiet; then
            echo 'Loader cache already refreshed.'
            exit 0
          fi
          git commit -m 'Refresh final school portal assets'
          git push origin HEAD:main
