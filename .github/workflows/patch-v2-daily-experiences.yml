name: Patch V2 Daily Experiences Pipeline

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-v2-daily-experiences.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Worker daily experiences patch
        run: python3 scripts/patch_v2_worker_daily_experiences.py
      - name: Apply Playgroup V2 publish schema
        run: python3 scripts/patch_playgroup_v2_publish_schema.py
      - name: Validate V2 time parsing
        run: |
          node -e "const t=/^([01]\\d|2[0-3]):[0-5]\\d$/; if(!t.test('09:30')||!t.test('12:30')||t.test('29:99')) process.exit(1)"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('worker/neo-lead-crm-api-worker-transport-phase1.js').read_text()
          a=s.index('function validateDailyExperiences')
          b=s.index('function validateLearningPlan',a)
          block=s[a:b]
          if '\\\\d' in block:
              raise SystemExit('Daily Experience time regex still contains double escaping')
          if "check start/end" not in block:
              raise SystemExit('Daily Experience validator missing')
          PY
      - name: Validate Worker syntax
        run: node --check worker/neo-lead-crm-api-worker-transport-phase1.js
      - name: Commit Worker patch
        run: |
          if git diff --quiet; then
            echo "No Worker changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/neo-lead-crm-api-worker-transport-phase1.js
          git commit -m "Lock Playgroup V2 daily Learning Experience schema"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 5
          done
          exit 1

