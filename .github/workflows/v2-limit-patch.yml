name: V2 Curriculum Limit Patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/v2-limit-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch curriculum capacity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('worker/neo-lead-crm-api-worker-transport-phase1.js')
          s = worker.read_text()
          old_count = s.count("lessons.length>1200")
          if old_count < 2:
              raise SystemExit(f'Expected at least 2 curriculum 1200-row guards, found {old_count}')
          s = s.replace("lessons.length>1200", "lessons.length>2200")
          s = s.replace("1â€“1200 concepts", "1â€“2200 concepts")
          s = s.replace("1–1200 concepts", "1–2200 concepts")
          s = s.replace("raw.length>1500000", "raw.length>8000000")
          worker.write_text(s)

          master = Path('curriculum-master.html')
          h = master.read_text()
          if "sheetRows:1202" not in h:
              raise SystemExit('Curriculum Master sheetRows guard not found')
          h = h.replace("if(f.size>1500000)throw Error('File is too large.');", "if(f.size>8000000)throw Error('File is too large.');")
          h = h.replace("sheetRows:1202", "sheetRows:2202")
          h = h.replace("raw.length>1200", "raw.length>2200")
          h = h.replace("Excel must contain 1–1200 lesson rows.", "Excel must contain 1–2200 Learning Experience rows.")
          master.write_text(h)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/neo-lead-crm-api-worker-transport-phase1.js curriculum-master.html
          git diff --cached --quiet && exit 0
          git commit -m "Raise curriculum capacity for V2 daily experiences"
          git push
