name: Fix Gate Photo Pass Refresh

on:
  push:
    paths:
      - '.github/workflows/fix-gate-photo-pass.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refresh patch
        run: python3 scripts/fix_gate_photo_pass.py
      - name: Check and commit
        run: |
          set -euo pipefail
          node --check /tmp/gate-checkin-inline.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gate-checkin.html
          git commit -m 'Keep gate pass photo visible during live refresh'
          git push origin HEAD:main
