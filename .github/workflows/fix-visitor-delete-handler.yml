name: Fix Visitor Delete Handler

on:
  push:
    paths:
      - '.github/workflows/fix-visitor-delete-handler.yml'
      - 'scripts/fix_visitor_delete_handler.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply handler fix
        run: python3 scripts/fix_visitor_delete_handler.py
      - name: Validate
        run: |
          node --check worker/gate-qr-parent-extension.js
          node --check worker/neo-lead-crm-api-worker-transport-phase1.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/gate-qr-parent-extension.js worker/neo-lead-crm-api-worker-transport-phase1.js
          if git diff --cached --quiet; then
            echo 'Handler already applied.'
            exit 0
          fi
          git commit -m 'Fix visitor delete backend handler'
          git push origin HEAD:main
