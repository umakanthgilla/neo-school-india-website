name: Apply Visitor Retention and Delete Controls

on:
  push:
    paths:
      - '.github/workflows/apply-visitor-retention.yml'
      - 'scripts/apply_visitor_retention.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply visitor retention patch
        run: python3 scripts/apply_visitor_retention.py
      - name: Validate JavaScript
        run: |
          node --check visitor-gate.js
          node --check worker/gate-qr-parent-extension.js
          node --check worker/neo-lead-crm-api-worker-transport-phase1.js
          node --check password-access.js
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visitor-gate.js password-access.js worker/gate-qr-parent-extension.js worker/neo-lead-crm-api-worker-transport-phase1.js
          if git diff --cached --quiet; then
            echo 'Visitor retention changes already applied.'
            exit 0
          fi
          git commit -m 'Add visitor-only retention and delete controls'
          git push origin HEAD:main
