name: Patch V2 Frontend Daily Experiences

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-v2-frontend-daily-experiences.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V2 frontend daily experiences patch
        run: python3 scripts/patch_v2_frontend_daily_experiences.py
      - name: Add V2 downloadable master template
        run: python3 scripts/patch_v2_master_template.py
      - name: Enable five Daily Experience prompts
        run: python3 scripts/patch_v2_five_prompts.py
      - name: Refresh V2 asset cache versions
        run: python3 scripts/patch_v2_cache_bust.py
      - name: Validate JavaScript syntax
        run: |
          node --check learning-admin.js
          node --check learning-family.js
          node --check family-portal.js
          node --check parent-pickup-approval.js
          node --check transport-portal.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('curriculum-master.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S)
          if not scripts:
              raise SystemExit('No inline curriculum script found')
          Path('/tmp/curriculum-master-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/curriculum-master-inline.js
      - name: Commit frontend patch
        run: |
          if git diff --quiet; then
            echo "No frontend changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curriculum-master.html learning-admin.js learning-family.js schools.html teachers.html
          git commit -m "Support V2 Learning Experience import capacity"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 5
          done
          exit 1

