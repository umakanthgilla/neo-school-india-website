name: Apply Student Admission No

on:
  push:
    paths:
      - '.github/workflows/apply-student-admission-no.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Admission No changes
        run: python3 scripts/apply-student-admission-no.py
      - name: Validate JavaScript
        run: |
          node --check worker/neo-lead-crm-api-worker-transport-phase1.js
          node --check worker/gate-qr-parent-extension.js
          node --check family-portal.js
          node --check handover-ui-cleanup.js
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/neo-lead-crm-api-worker-transport-phase1.js worker/gate-qr-parent-extension.js schools.html gate-checkin.html family-portal.js parents.html
          if git diff --cached --quiet; then
            echo 'Admission No changes already applied.'
          else
            git commit -m 'Add shareable student Admission No'
            git push origin HEAD:main
          fi
      - name: Prepare Worker package
        run: |
          mkdir -p package
          cp worker/neo-lead-crm-api-worker-transport-phase1.js package/
          cat > package/README.txt <<'EOF'
          Neo School India latest Worker.
          Includes shareable student Admission No. format such as NEO26J0001,
          Child Pickup lookup by Admission No. or legacy internal Student ID,
          visitor cleanup, gate photos, and all previously deployed backend features.
          Replace code only in the existing Cloudflare Worker neo-lead-crm-api.
          Do not create a new Worker or D1 database.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: NEO_LATEST_WORKER_ADMISSION_NO
          path: package/
          retention-days: 1
