name: Package Latest Worker Download

on:
  push:
    paths:
      - '.github/workflows/package-worker-download.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare latest worker package
        run: |
          set -euo pipefail
          mkdir -p package
          cp worker/neo-lead-crm-api-worker-transport-phase1.js package/
          printf '%s\n' 'Latest Neo School India Worker for existing Cloudflare worker neo-lead-crm-api.' > package/README.txt
          printf '%s\n' 'Use neo-lead-crm-api-worker-transport-phase1.js as the Worker code. Do not create a new Worker or D1 database.' >> package/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NEO_LATEST_WORKER
          path: package/
          retention-days: 1
