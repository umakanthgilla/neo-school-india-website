name: Apply final print and mascot polish
on:
  push:
    paths:
      - '.github/workflows/apply-final-print-mascot.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI polish
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Load print UI in school portal.
          p=Path('password-access.js')
          s=p.read_text()
          needle="['/admission-workflow.js?v=20261001-admission1','neoAdmissionWorkflow'],"
          add=needle+"['/neo-print-ui.js?v=20261001-print1','neoPrintUi'],"
          if 'neo-print-ui.js' not in s:
              if needle not in s: raise SystemExit('password loader anchor missing')
              s=s.replace(needle,add)
              p.write_text(s)

          # 2) Walking mascot only on parent enquiry page, subtle and accessibility-friendly.
          p=Path('neo-public-theme.css')
          s=p.read_text()
          marker='/* NEO enquiry walking mascot */'
          if marker not in s:
              s += '''\n/* NEO enquiry walking mascot */\n.neo-enquiry-page .neo-public-shell{position:relative}\n.neo-enquiry-page .neo-public-shell:before{content:"";position:fixed;z-index:45;left:-82px;top:8px;width:58px;height:58px;background:url('/neo%20owl.jpeg') center/contain no-repeat;mix-blend-mode:multiply;pointer-events:none;animation:neoEnquiryWalk 22s linear infinite;filter:drop-shadow(0 4px 6px rgba(7,27,82,.08))}\n@keyframes neoEnquiryWalk{0%{transform:translateX(0) translateY(0) rotate(-2deg)}12%{transform:translateX(calc(12vw + 20px)) translateY(-2px) rotate(1deg)}25%{transform:translateX(calc(25vw + 40px)) translateY(1px) rotate(-1deg)}50%{transform:translateX(calc(50vw + 80px)) translateY(-2px) rotate(1deg)}75%{transform:translateX(calc(75vw + 120px)) translateY(1px) rotate(-1deg)}100%{transform:translateX(calc(100vw + 170px)) translateY(0) rotate(1deg)}}\n@media(max-width:560px){.neo-enquiry-page .neo-public-shell:before{width:46px;height:46px;top:8px;animation-duration:18s}}\n@media(prefers-reduced-motion:reduce){.neo-enquiry-page .neo-public-shell:before{animation:none;display:none}}\n'''
              p.write_text(s)

          # 3) Cache bump public theme so browser gets mascot change.
          for name in ['admission-enquiry.html','admission-form.html']:
              p=Path(name); s=p.read_text().replace('neo-public-theme.css?v=20261001-public1','neo-public-theme.css?v=20261001-public2'); p.write_text(s)

          # 4) Remove patched-looking mascot from Gate form header; preserve colorful clean header.
          p=Path('gate-entry-ui.js')
          s=p.read_text()
          marker='/* gate header mascot cleanup */'
          if marker not in s:
              insert='''\n/* gate header mascot cleanup */\nconst headerCleanup=document.createElement('style');headerCleanup.textContent=`.neo-gate-entry-v2 .brand.neo-gate-brand-v2{padding-right:28px!important;min-height:108px!important}.neo-gate-entry-v2 .brand.neo-gate-brand-v2:after{display:none!important}@media(max-width:700px){.neo-gate-entry-v2 .brand.neo-gate-brand-v2{padding-right:18px!important;min-height:100px!important}}`;document.head.append(headerCleanup);\n'''
              pos=s.rfind('})();')
              if pos<0: raise SystemExit('gate entry close missing')
              s=s[:pos]+insert+s[pos:]
              p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          node --check neo-print-ui.js
          node --check gate-entry-ui.js
          node --check password-access.js
      - name: Commit product changes and remove workflow
        run: |
          git config user.name "umakanthgilla"
          git config user.email "umakanthgilla@gmail.com"
          git add password-access.js neo-public-theme.css admission-enquiry.html admission-form.html gate-entry-ui.js
          git commit -m "Polish enquiry mascot and QR print templates" || true
          git rm .github/workflows/apply-final-print-mascot.yml
          git commit -m "Remove temporary print polish workflow"
          git push
