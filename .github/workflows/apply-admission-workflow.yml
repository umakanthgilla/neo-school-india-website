name: Apply Parent Admission Workflow

on:
  push:
    paths:
      - '.github/workflows/apply-admission-workflow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and apply admission workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          parts=[Path('scripts/_admission_part1.txt'),Path('scripts/_admission_part2.txt'),Path('scripts/_admission_part3.txt')]
          ext=''.join(p.read_text() for p in parts)
          ext_path=Path('worker/admission-workflow-extension.js')
          ext_path.write_text(ext)

          worker_path=Path('worker/neo-lead-crm-api-worker-transport-phase1.js')
          worker=worker_path.read_text()
          needle='    const url = new URL(request.url);\n'
          route=needle+'    const admissionWorkflowResponse = await admissionWorkflowPortal(request, env, url);\n    if (admissionWorkflowResponse) return admissionWorkflowResponse;\n'
          if 'admissionWorkflowPortal(request, env, url)' not in worker:
              if needle not in worker:
                  raise SystemExit('Worker router marker not found')
              worker=worker.replace(needle,route,1)
          if 'const ADMISSION_SCHEMA=[' not in worker:
              worker=worker.rstrip()+'\n\n'+ext+'\n'
          worker_path.write_text(worker)

          p=Path('password-access.js')
          s=p.read_text()
          marker="['/handover-ui-cleanup.js?v=20261001-final2','neoHandoverUiCleanup']"
          add="['/admission-workflow.js?v=20261001-admission1','neoAdmissionWorkflow'],"+marker
          if 'neoAdmissionWorkflow' not in s:
              if marker not in s:
                  raise SystemExit('Password loader marker not found')
              s=s.replace(marker,add,1)
          p.write_text(s)

          schools=Path('schools.html')
          h=schools.read_text()
          h=re.sub(r'/password-access\.js\?v=[^"\']+', '/password-access.js?v=20261001-admission1', h)
          schools.write_text(h)
          PY

      - name: Validate JavaScript
        run: |
          node --check admission-workflow.js
          node --check worker/admission-workflow-extension.js
          node --check worker/neo-lead-crm-api-worker-transport-phase1.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          for name in ['admission-enquiry.html','admission-form.html']:
              html=Path(name).read_text()
              scripts=re.findall(r'<script>([\s\S]*?)</script>',html)
              Path('/tmp/'+name+'.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/admission-enquiry.html.js
          node --check /tmp/admission-form.html.js

      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/admission-workflow-extension.js worker/neo-lead-crm-api-worker-transport-phase1.js password-access.js schools.html
          if git diff --cached --quiet; then
            echo 'Admission workflow already applied.'
          else
            git commit -m 'Add parent-led admission conversion workflow'
            git push origin HEAD:main
          fi

      - name: Prepare deploy package
        run: |
          mkdir -p package
          cp worker/neo-lead-crm-api-worker-transport-phase1.js package/
          cat > package/README.txt <<'EOF'
          Neo School India - Parent Admission Workflow Worker

          Deploy ONLY to the existing Cloudflare Worker:
          neo-lead-crm-api

          Do not create a new Worker or D1 database.
          This package includes the existing live features plus:
          - Parent self-enquiry support
          - Proceed / Manage Admission secure parent link
          - Parent admission details + previous education rules
          - Birth Certificate / optional masked Aadhaar / previous-class document upload
          - Review & Confirm
          - School correction request / verification
          - Student Master + Admission No generation only after approval
          - Duplicate-student guard
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: NEO_LATEST_WORKER_ADMISSION_FLOW
          path: package/
          retention-days: 1
