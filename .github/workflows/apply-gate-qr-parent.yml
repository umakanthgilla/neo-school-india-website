name: Apply Gate QR Parent Backend

on:
  push:
    paths:
      - '.github/workflows/apply-gate-qr-parent.yml'
      - 'worker/gate-qr-parent-extension.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh gate QR backend extension
        run: |
          set -euo pipefail
          TARGET='worker/neo-lead-crm-api-worker-transport-phase1.js'
          EXT='worker/gate-qr-parent-extension.js'
          python3 - <<'PY'
          from pathlib import Path
          target=Path('worker/neo-lead-crm-api-worker-transport-phase1.js')
          ext=Path('worker/gate-qr-parent-extension.js').read_text().rstrip()+'\n'
          text=target.read_text()
          old_call='    const gateQrParentResponse = await gateQrParentPortal(request, env, url);'
          new_call='    const gateQrParentResponse = await gateQrParentPortal(request, env, url, ctx);'
          if old_call in text:
              text=text.replace(old_call,new_call,1)
          elif new_call not in text:
              needle='    const url = new URL(request.url);\n    const visitorFacilitiesResponse = await visitorFacilitiesPortal(request, env, url);'
              replacement='    const url = new URL(request.url);\n'+new_call+'\n    if (gateQrParentResponse) return gateQrParentResponse;\n    const visitorFacilitiesResponse = await visitorFacilitiesPortal(request, env, url);'
              if needle not in text:
                  raise SystemExit('Worker router marker not found; no source changes made.')
              text=text.replace(needle,replacement,1)
          marker='/* Gate QR self check-in + parent-confirmed child pickup extension.'
          pos=text.find(marker)
          if pos>=0:
              text=text[:pos].rstrip()+'\n\n'+ext
          else:
              text=text.rstrip()+'\n\n'+ext
          target.write_text(text)
          PY
          node --check "$TARGET"
          if git diff --quiet -- "$TARGET"; then
            echo 'Worker already matches latest gate extension.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'Refresh QR gate and parent pickup backend'
          git push origin HEAD:main
