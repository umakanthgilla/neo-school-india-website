<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Neo School India | Supply Chain CRM</title><link rel="icon" type="image/svg+xml" href="/neo-favicon-v4.svg">
<style>
:root{font-family:Inter,system-ui,sans-serif;--navy:#071b52;--blue:#118be8;--green:#259447;--gold:#f4c400;--ink:#13213c;--muted:#687891;--line:#dce6f2;--bg:#f4f7fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#071b52,#0b397f)}.login-card{width:min(430px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 25px 70px #00102b66}.login-card img{width:170px}.login-card h1{color:var(--navy);margin:18px 0 5px}.login-card p{color:var(--muted)}label{display:grid;gap:6px;font-size:12px;font-weight:750;color:var(--navy);margin:11px 0}input,select,textarea{width:100%;border:1px solid #cbd8e8;border-radius:10px;padding:11px;background:#fff;color:var(--ink)}textarea{min-height:80px;resize:vertical}button{border:0;border-radius:10px;background:var(--navy);color:#fff;padding:11px 15px;font-weight:850}button.secondary{background:#eaf2ff;color:var(--navy)}button:disabled{opacity:.55}.login-card button{width:100%;margin-top:8px}.error{color:#a22b21;white-space:pre-wrap}.topbar{position:sticky;top:0;z-index:10;background:#fff;border-top:4px solid var(--blue);border-bottom:1px solid var(--line)}.topbar-in{max-width:1500px;margin:auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:13px}.brand img{width:145px}.brand b{display:block;color:var(--navy);font-size:17px}.brand span{font-size:11px;color:var(--muted)}.top-actions{display:flex;gap:8px;align-items:center}.badge{border-radius:999px;background:#eef5ff;padding:8px 11px;font-size:11px;font-weight:900;color:var(--navy)}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1500px;margin:auto}.side{min-height:calc(100vh - 88px);background:#071b52;padding:20px 14px;position:sticky;top:88px;align-self:start}.side button{display:flex;width:100%;text-align:left;background:transparent;color:#dce8ff;margin:3px 0}.side button.active{background:#fff;color:var(--navy)}.main{padding:28px;min-width:0}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end}.hero h1{margin:0;color:var(--navy);font-size:clamp(28px,4vw,44px)}.hero p{margin:5px 0;color:var(--muted)}.status{min-height:24px;color:#176d36;font-size:13px;margin:10px 0}.stats,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stats article,.card,.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px}.stats span{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:850}.stats strong{display:block;color:var(--navy);font-size:25px;margin-top:5px}.panel{margin:16px 0}.panel h2,.panel h3,.card h3{color:var(--navy);margin-top:0}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.fields label{margin:0}.cards{display:grid;gap:10px}.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}.card h3{margin-bottom:5px}.card p{color:var(--muted);font-size:12px;margin:4px 0}.right{text-align:right}.pill{display:inline-flex;border-radius:999px;padding:5px 9px;background:#eaf2ff;color:#174d92;font-size:10px;font-weight:900}.pill.pending{background:#fff1cc;color:#6e4d00}.pill.done{background:#eaf9ee;color:#16743a}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.empty{color:var(--muted);padding:18px}.tab-title{display:flex;justify-content:space-between;gap:14px;align-items:center}.money{font-size:17px;color:var(--navy)}@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{position:static;min-height:auto;display:flex;overflow:auto}.side button{min-width:max-content}.stats,.grid{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr 1fr}}@media(max-width:620px){.topbar-in,.hero,.card{display:block}.top-actions{margin-top:10px}.main{padding:18px}.stats,.grid,.fields{grid-template-columns:1fr}.right{text-align:left;margin-top:10px}}
</style>
</head>
<body>
<section id="login" class="login"><form id="loginForm" class="login-card"><img src="/neo-top-logo.jpeg" alt="Neo School India"><h1>Supply Chain CRM</h1><p>Private Head Office procurement, warehouse and fulfillment workspace.</p><label>Head Office password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><p id="loginError" class="error"></p></form></section>
<div id="app" class="hidden"><header class="topbar"><div class="topbar-in"><div class="brand"><img src="/neo-top-logo.jpeg" alt="Neo School India"><div><b>Head Office Supply Chain</b><span>Center demand · Vendors · Warehouse · Dispatch</span></div></div><div class="top-actions"><span class="badge">Private Operations</span><button id="refresh" class="secondary">Refresh</button><button id="logout" class="secondary">Logout</button></div></div></header><div class="shell"><nav class="side" id="nav"></nav><main class="main"><div class="hero"><div><h1 id="pageTitle">Supply Chain Dashboard</h1><p id="pageSub">One connected flow from center order to delivery.</p></div></div><div id="status" class="status" role="status"></div><div id="content"></div></main></div></div>
<script>
const API='https://neo-lead-crm-api.umakanthgilla.workers.dev',tabs=[['dashboard','Dashboard'],['center_orders','Center Orders'],['demand','Demand Consolidation'],['vendors','Vendor Master'],['products','Products & Kits'],['vendor_pos','Vendor Purchase Orders'],['warehouse','Warehouse & GRN'],['packing','Packing'],['dispatch','Dispatch & Tracking'],['finance','Vendor Finance']],$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=p=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format((Number(p)||0)/100),today=()=>new Date(Date.now()+330*60000).toISOString().slice(0,10);
let token=sessionStorage.getItem('neo_crm_token')||'',data={},tab='dashboard';
async function api(path,method='GET',body){const r=await fetch(API+path,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})}),b=await r.json().catch(()=>({}));if(r.status===401){signOut();throw Error('Head Office session expired.')}if(!r.ok)throw Error(b.error||'Request failed');return b}
function note(s,bad=false){$('#status').textContent=s;$('#status').style.color=bad?'#a22b21':'#176d36'}function signOut(){token='';sessionStorage.removeItem('neo_crm_token');$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}
$('#loginForm').onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;$('#loginError').textContent='';try{const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:e.target.password.value})}),b=await r.json();if(!r.ok||!b.success)throw Error(b.error||'Login failed');token=b.token;sessionStorage.setItem('neo_crm_token',token);e.target.reset();start()}catch(x){$('#loginError').textContent=x.message;e.submitter.disabled=false}};$('#logout').onclick=signOut;$('#refresh').onclick=load;
function start(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#nav').innerHTML=tabs.map(([k,v])=>`<button data-tab="${k}">${v}</button>`).join('');$('#nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;render()};load()}
async function load(){note('Loading connected supply-chain records…');try{data=await api('/api/supply/dashboard');note('✓ Supply-chain records refreshed.');render()}catch(e){note(e.message,true)}}
const stage=o=>o.status==='Submitted'?'Pending approval':o.status==='Delivered'?'Center received':o.status==='Approved'?'Head Office received':o.status;
function head(title,sub){$('#pageTitle').textContent=title;$('#pageSub').textContent=sub;$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function card(title,lines,right=''){return `<article class="card"><div><h3>${esc(title)}</h3>${lines.map(x=>`<p>${x}</p>`).join('')}</div><div class="right">${right}</div></article>`}
function saveForm(id,kind,prepare){const f=$(id);if(!f)return;f.onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;try{const b=Object.fromEntries(new FormData(f));prepare?.(b);await api('/api/supply/'+kind,'POST',b);f.reset();await load();note('✓ Saved successfully.')}catch(x){note(x.message,true);e.submitter.disabled=false}}}
function render(){if(!data.center_orders)return;const c=$('#content');if(tab==='dashboard'){head('Supply Chain Dashboard','Center demand, vendor procurement, central stock, packing and dispatch.');const pending=data.center_orders.filter(x=>x.status==='Submitted').length,openPO=data.vendor_pos.filter(x=>!['Received','Cancelled'].includes(x.status)).length,stock=data.central_stock.reduce((n,x)=>n+Number(x.on_hand||0),0),packed=data.packs.filter(x=>['Packed','Quality Checked'].includes(x.status)).length;c.innerHTML=`<section class="stats"><article><span>Center orders pending</span><strong>${pending}</strong></article><article><span>Open vendor POs</span><strong>${openPO}</strong></article><article><span>Central stock units</span><strong>${stock}</strong></article><article><span>Ready packs</span><strong>${packed}</strong></article></section><section class="panel"><h2>Operations pipeline</h2><div class="grid"><article class="card"><div><h3>1 · Center demand</h3><p>Receive and approve center supply orders.</p></div></article><article class="card"><div><h3>2 · Procurement</h3><p>Aggregate demand and place Vendor POs.</p></div></article><article class="card"><div><h3>3 · Warehouse</h3><p>GRN, quality check and central stock.</p></div></article><article class="card"><div><h3>4 · Fulfillment</h3><p>Pack, dispatch and track delivery.</p></div></article></div></section>`;return}
if(tab==='center_orders'){head('Center Supply Orders','Orders received from all Neo School India centers.');c.innerHTML=`<section class="stats"><article><span>Total orders</span><strong>${data.center_orders.length}</strong></article><article><span>Pending approval</span><strong>${data.center_orders.filter(x=>x.status==='Submitted').length}</strong></article><article><span>Head Office received</span><strong>${data.center_orders.filter(x=>x.status==='Approved').length}</strong></article><article><span>Center received</span><strong>${data.center_orders.filter(x=>x.status==='Delivered').length}</strong></article></section><section class="panel"><div class="cards">${data.center_orders.map(o=>card(o.school_name+' · '+o.item_name,[`${esc(o.po_no||o.id)} · ${esc(o.category)} · ${esc(o.program||'School-wide')}`,`Order ${esc(o.quantity)} · Center received ${esc(o.received_quantity||0)} · ${esc(o.payment_terms)}`,`<span class="pill ${o.status==='Submitted'?'pending':o.status==='Delivered'?'done':''}">${esc(stage(o))}</span>`],`<strong class="money">${money(o.total_paise)}</strong>${o.status==='Submitted'?`<div class="toolbar"><button data-center-approve="${esc(o.id)}" data-school="${esc(o.school_id)}">Receive & Approve</button></div>`:''}`)).join('')||'<p class="empty">No center orders.</p>'}</div></section>`;c.querySelectorAll('[data-center-approve]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('/api/supply/center-orders/'+encodeURIComponent(b.dataset.school)+'/'+encodeURIComponent(b.dataset.centerApprove),'PATCH',{status:'Approved',office_note:'Order received by Head Office Supply Chain'});await load()}catch(x){note(x.message,true);b.disabled=false}});return}
if(tab==='demand'){head('Demand Consolidation','Combined center demand for vendor purchasing and stock planning.');const map=new Map();data.center_orders.filter(x=>!['Cancelled'].includes(x.status)).forEach(o=>{const key=[o.category,o.item_name,o.program||'School-wide',o.size||''].join('|'),x=map.get(key)||{category:o.category,item_name:o.item_name,program:o.program||'School-wide',size:o.size||'',centers:new Set(),ordered:0,delivered:0};x.centers.add(o.school_id);x.ordered+=Number(o.quantity||0);x.delivered+=Number(o.received_quantity||0);map.set(key,x)});const rows=[...map.values()].sort((a,b)=>b.ordered-a.ordered);c.innerHTML=`<section class="stats"><article><span>Demand lines</span><strong>${rows.length}</strong></article><article><span>Centers ordering</span><strong>${new Set(data.center_orders.map(x=>x.school_id)).size}</strong></article><article><span>Total units ordered</span><strong>${rows.reduce((n,x)=>n+x.ordered,0)}</strong></article><article><span>Units still due</span><strong>${rows.reduce((n,x)=>n+Math.max(0,x.ordered-x.delivered),0)}</strong></article></section><section class="panel"><div class="cards">${rows.map(x=>card(x.item_name,[`${esc(x.category)} · ${esc(x.program)}${x.size?' · '+esc(x.size):''}`,`${x.centers.size} centers · Demand ${x.ordered} · Center delivered ${x.delivered}`],`<span class="pill pending">Purchase plan ${Math.max(0,x.ordered-x.delivered)}</span>`)).join('')||'<p class="empty">No demand to consolidate.</p>'}</div></section>`;return}
if(tab==='vendors'){head('Vendor Master','Create and manage uniforms, books, bags and other suppliers.');c.innerHTML=`<section class="panel"><h2>Add vendor</h2><form id="vendorForm"><div class="fields"><label>Vendor name<input name="name" required></label><label>Vendor type<select name="vendor_type" required><option>Uniforms</option><option>Books printing</option><option>Bags</option><option>Shoes</option><option>Stationery</option><option>ID cards</option><option>Courier</option><option>Other</option></select></label><label>Contact person<input name="contact_person"></label><label>Mobile<input name="mobile"></label><label>Email<input name="email" type="email"></label><label>GSTIN<input name="gstin"></label><label>Credit days<input name="credit_days" type="number" min="0" value="30"></label><label>Lead days<input name="lead_days" type="number" min="0" value="7"></label><label>Address<textarea name="address"></textarea></label></div><button>Save vendor</button></form></section><div class="cards">${data.vendors.map(v=>card(v.name,[`${esc(v.vendor_type)} · ${esc(v.status)}`,`${esc(v.contact_person||'—')} · ${esc(v.mobile||'—')}`,`Credit ${esc(v.credit_days)} days · Lead ${esc(v.lead_days)} days`])).join('')||'<p class="empty">No vendors yet.</p>'}</div>`;saveForm('#vendorForm','vendors',b=>{b.credit_days=Number(b.credit_days||0);b.lead_days=Number(b.lead_days||0)});return}
if(tab==='products'){head('Products & Kit Master','Central component catalogue and kit definitions.');c.innerHTML=`<section class="panel"><h2>Add component or kit</h2><form id="productForm"><div class="fields"><label>SKU<input name="sku" required></label><label>Name<input name="name" required></label><label>Type<select name="product_type"><option>Component</option><option>Kit</option></select></label><label>Category<select name="category"><option>Uniforms</option><option>Books</option><option>Bags</option><option>Shoes</option><option>Stationery</option><option>Complete kit</option><option>Other</option></select></label><label>Unit<input name="unit" value="Pieces" required></label><label>Reorder level<input name="reorder_level" type="number" min="0" value="0"></label></div><button>Save product</button></form></section><div class="cards">${data.central_stock.map(p=>card(p.name,[`${esc(p.sku)} · ${esc(p.product_type)} · ${esc(p.category)}`,`Reorder below ${esc(p.reorder_level)} ${esc(p.unit)}`],`<span class="pill ${p.on_hand<=p.reorder_level?'pending':'done'}">Stock ${esc(p.on_hand)}</span>`)).join('')||'<p class="empty">No products yet.</p>'}</div>`;saveForm('#productForm','products',b=>b.reorder_level=Number(b.reorder_level||0));return}
if(tab==='vendor_pos'){head('Vendor Purchase Orders','Head Office orders placed separately with suppliers.');c.innerHTML=`<section class="panel"><h2>Create Vendor PO</h2><form id="vpoForm"><div class="fields"><label>Vendor<select name="vendor_id" required><option value="">Choose…</option>${data.vendors.filter(x=>x.status==='Active').map(x=>`<option value="${esc(x.id)}">${esc(x.name)} · ${esc(x.vendor_type)}</option>`).join('')}</select></label><label>Product<select name="product_id" required><option value="">Choose…</option>${data.products.filter(x=>x.status==='Active').map(x=>`<option value="${esc(x.id)}">${esc(x.name)} · ${esc(x.sku)}</option>`).join('')}</select></label><label>Quantity<input name="quantity" type="number" min="1" required></label><label>Unit price INR<input name="unit_price" type="number" min="0.01" step=".01" required></label><label>Order date<input name="order_date" type="date" required></label><label>Expected date<input name="expected_date" type="date" required></label><label>Payment terms<input name="payment_terms" value="Credit · 30 days" required></label><label>Notes<textarea name="notes"></textarea></label></div><button>Create Vendor PO</button></form></section><div class="cards">${data.vendor_pos.map(p=>card(p.vendor_name+' · '+p.product_name,[`${esc(p.po_no)} · ${esc(p.status)}`,`Ordered ${esc(p.quantity)} · Received ${esc(p.received_quantity||0)} · Due ${esc(p.expected_date)}`],`<strong class="money">${money(p.total_paise)}</strong>${p.status==='Draft'?`<div class="toolbar"><button data-vpo="${esc(p.id)}" data-status="Approved">Approve</button></div>`:p.status==='Approved'?`<div class="toolbar"><button data-vpo="${esc(p.id)}" data-status="Sent to Vendor">Mark sent</button></div>`:''}`)).join('')||'<p class="empty">No Vendor POs yet.</p>'}</div>`;const vf=$('#vpoForm');vf.order_date.value=today();saveForm('#vpoForm','vendor_pos',b=>{b.quantity=Number(b.quantity);b.unit_price_paise=Math.round(Number(b.unit_price)*100);delete b.unit_price});c.querySelectorAll('[data-vpo]').forEach(b=>b.onclick=()=>patch('vendor_pos',b.dataset.vpo,b.dataset.status));return}
if(tab==='warehouse'){head('Warehouse & Goods Receipt','Receive vendor supply into Head Office central inventory.');c.innerHTML=`<section class="panel"><h2>Record GRN</h2><form id="grnForm"><div class="fields"><label>Open Vendor PO<select name="vendor_po_id" required><option value="">Choose…</option>${data.vendor_pos.filter(x=>!['Draft','Cancelled','Received'].includes(x.status)).map(x=>`<option value="${esc(x.id)}">${esc(x.po_no)} · ${esc(x.product_name)} · balance ${x.quantity-(x.received_quantity||0)}</option>`).join('')}</select></label><label>Received quantity<input name="received_quantity" type="number" min="1" required></label><label>Damaged quantity<input name="damaged_quantity" type="number" min="0" value="0"></label><label>Receipt date<input name="receipt_date" type="date" required></label><label>Supplier invoice<input name="supplier_invoice" required></label><label>Condition<select name="condition"><option>Good</option><option>Partly damaged</option></select></label><label>Warehouse location<input name="warehouse_location" required></label><label>Notes<textarea name="notes"></textarea></label></div><button>Receive into central stock</button></form></section><div class="cards">${data.warehouse_receipts.map(g=>card(g.product_name,[`${esc(g.grn_no)} · ${esc(g.vendor_name)}`,`Accepted ${esc(g.accepted_quantity)} · Damaged ${esc(g.damaged_quantity)} · ${esc(g.receipt_date)}`,`Invoice ${esc(g.supplier_invoice)} · ${esc(g.warehouse_location)}`],`<span class="pill done">${esc(g.status)}</span>`)).join('')||'<p class="empty">No warehouse receipts yet.</p>'}</div>`;$('#grnForm').receipt_date.value=today();saveForm('#grnForm','warehouse_receipts',b=>{b.received_quantity=Number(b.received_quantity);b.damaged_quantity=Number(b.damaged_quantity||0)});return}
if(tab==='packing'){head('Packing & Quality Check','Allocate central stock and prepare center consignments.');c.innerHTML=`<section class="panel"><h2>Create pack</h2><form id="packForm"><div class="fields"><label>Center order<select name="center_order_key" required><option value="">Choose…</option>${data.center_orders.filter(x=>x.status==='Approved').map(x=>`<option value="${esc(x.school_id+'|'+x.id)}">${esc(x.school_name)} · ${esc(x.item_name)} · ${esc(x.quantity)}</option>`).join('')}</select></label><label>Central product<select name="product_id" required><option value="">Choose…</option>${data.central_stock.filter(x=>x.on_hand>0).map(x=>`<option value="${esc(x.id)}">${esc(x.name)} · available ${esc(x.on_hand)}</option>`).join('')}</select></label><label>Quantity<input name="quantity" type="number" min="1" required></label><label>Boxes<input name="box_count" type="number" min="1" value="1" required></label><label>Weight kg<input name="weight_kg" type="number" min="0" step=".01"></label><label>Packed by<input name="packed_by" required></label><label>Checked by<input name="checked_by"></label><label>Notes<textarea name="notes"></textarea></label></div><button>Create packing job</button></form></section><div class="cards">${data.packs.map(p=>card(p.school_name+' · '+p.product_name,[`${esc(p.pack_no)} · ${esc(p.status)}`,`${esc(p.quantity)} units · ${esc(p.box_count)} boxes · Packed by ${esc(p.packed_by)}`],p.status==='Packing'?`<button data-pack="${esc(p.id)}" data-status="Packed">Mark packed</button>`:p.status==='Packed'?`<button data-pack="${esc(p.id)}" data-status="Quality Checked">Quality checked</button>`:`<span class="pill done">${esc(p.status)}</span>`)).join('')||'<p class="empty">No packing jobs yet.</p>'}</div>`;saveForm('#packForm','packs',b=>{const o=data.center_orders.find(x=>x.school_id+'|'+x.id===b.center_order_key);if(!o)throw Error('Choose a Center Order.');b.school_id=o.school_id;b.school_name=o.school_name;b.center_order_id=o.id;delete b.center_order_key;b.quantity=Number(b.quantity);b.box_count=Number(b.box_count);b.weight_kg=Number(b.weight_kg||0)});c.querySelectorAll('[data-pack]').forEach(b=>b.onclick=()=>patch('packs',b.dataset.pack,b.dataset.status));return}
if(tab==='finance'){head('Vendor Finance','Payables generated automatically from accepted warehouse receipts.');const outstanding=data.vendor_payables.reduce((n,x)=>n+Number(x.outstanding_paise||0),0),paid=data.vendor_payments.reduce((n,x)=>n+Number(x.amount_paise||0),0);c.innerHTML=`<section class="stats"><article><span>Total payables</span><strong>${data.vendor_payables.length}</strong></article><article><span>Outstanding</span><strong>${money(outstanding)}</strong></article><article><span>Payments posted</span><strong>${money(paid)}</strong></article><article><span>Overdue</span><strong>${data.vendor_payables.filter(x=>x.outstanding_paise>0&&x.due_date<today()).length}</strong></article></section><section class="panel"><h2>Record vendor payment</h2><form id="vendorPayForm"><div class="fields"><label>Outstanding payable<select name="payable_id" required><option value="">Choose…</option>${data.vendor_payables.filter(x=>x.outstanding_paise>0).map(x=>`<option value="${esc(x.id)}">${esc(x.vendor_name)} · ${esc(x.invoice_no)} · ${money(x.outstanding_paise)}</option>`).join('')}</select></label><label>Amount INR<input name="amount" type="number" min=".01" step=".01" required></label><label>Payment date<input name="payment_date" type="date" required></label><label>Payment mode<select name="payment_mode"><option>Bank transfer</option><option>UPI</option><option>Cheque</option><option>Cash</option></select></label><label>Reference<input name="reference" required></label><label>Notes<textarea name="notes"></textarea></label></div><button>Post vendor payment</button></form></section><div class="cards">${data.vendor_payables.map(p=>card(p.vendor_name,[`${esc(p.payable_no)} · Invoice ${esc(p.invoice_no)} · Due ${esc(p.due_date)}`,`Amount ${money(p.amount_paise)} · Paid ${money(p.paid_paise)} · ${esc(p.status)}`],`<strong class="money">${money(p.outstanding_paise)}</strong>`)).join('')||'<p class="empty">No vendor payables yet.</p>'}</div>`;$('#vendorPayForm').payment_date.value=today();saveForm('#vendorPayForm','vendor_payments',b=>{b.amount_paise=Math.round(Number(b.amount)*100);delete b.amount});return}
head('Dispatch & Courier Tracking','Ship packed orders and monitor delivery to each center.');c.innerHTML=`<section class="panel"><h2>Create shipment</h2><form id="shipForm"><div class="fields"><label>Ready pack<select name="pack_id" required><option value="">Choose…</option>${data.packs.filter(x=>['Packed','Quality Checked'].includes(x.status)&&!data.shipments.some(s=>s.pack_id===x.id&&!['Cancelled'].includes(s.status))).map(x=>`<option value="${esc(x.id)}">${esc(x.pack_no)} · ${esc(x.school_name)}</option>`).join('')}</select></label><label>Courier partner<input name="courier_partner" required></label><label>AWB / LR number<input name="awb_no" required></label><label>Dispatch date<input name="dispatch_date" type="date" required></label><label>Expected delivery<input name="expected_delivery" type="date" required></label><label>Freight INR<input name="freight" type="number" min="0" step=".01" value="0"></label><label>Tracking / proof URL<input name="proof_url"></label><label>Notes<textarea name="notes"></textarea></label></div><button>Create shipment</button></form></section><div class="cards">${data.shipments.map(s=>card(s.school_name,[`${esc(s.shipment_no)} · ${esc(s.status)}`,`${esc(s.courier_partner)} · AWB ${esc(s.awb_no)} · ${esc(s.box_count)} boxes`,`Dispatched ${esc(s.dispatch_date)} · Expected ${esc(s.expected_delivery)}`],!['Delivered','Cancelled'].includes(s.status)?`<div class="toolbar"><button data-ship="${esc(s.id)}" data-status="In Transit">In transit</button><button data-ship="${esc(s.id)}" data-status="Delivered">Delivered</button></div>`:`<span class="pill done">${esc(s.status)}</span>`)).join('')||'<p class="empty">No shipments yet.</p>'}</div>`;$('#shipForm').dispatch_date.value=today();saveForm('#shipForm','shipments',b=>{b.freight_paise=Math.round(Number(b.freight||0)*100);delete b.freight});c.querySelectorAll('[data-ship]').forEach(b=>b.onclick=()=>patch('shipments',b.dataset.ship,b.dataset.status))}
async function patch(kind,id,status){try{await api('/api/supply/'+kind+'/'+encodeURIComponent(id),'PATCH',{status});await load();note('✓ Status updated to '+status+'.')}catch(e){note(e.message,true)}}
if(token)start();
</script>
</body></html>
