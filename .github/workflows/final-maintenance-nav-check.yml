name: Final Maintenance Navigation Check

on:
  push:
    paths:
      - '.github/workflows/final-maintenance-nav-check.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate JavaScript
        run: |
          node --check handover-ui-cleanup.js
          node --check password-access.js
      - name: Refresh school portal cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('schools.html')
          s=p.read_text()
          if '/password-access.js?v=7' in s:
              s=s.replace('/password-access.js?v=7','/password-access.js?v=8',1)
              p.write_text(s)
          elif '/password-access.js?v=8' not in s:
              raise SystemExit('password-access loader marker not found')
          PY
      - name: Commit cache refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schools.html
          if git diff --cached --quiet; then
            echo 'Cache already current.'
          else
            git commit -m 'Refresh final Maintenance navigation assets'
            git push origin HEAD:main
          fi
