name: Apply Student Tab Stability Refresh

on:
  push:
    paths:
      - '.github/workflows/apply-student-tab-stability.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh student tab assets
        run: |
          set -euo pipefail
          node --check student-class-link.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('password-access.js')
          s=p.read_text()
          old="/student-class-link.js?v=20260930-link1"
          new="/student-class-link.js?v=20261001-link2"
          if old not in s and new not in s:
              raise SystemExit('student class link loader marker not found')
          if old in s:
              p.write_text(s.replace(old,new,1))
          q=Path('schools.html')
          h=q.read_text()
          old2='/password-access.js?v=5'
          new2='/password-access.js?v=6'
          if old2 not in h and new2 not in h:
              raise SystemExit('password access loader marker not found')
          if old2 in h:
              q.write_text(h.replace(old2,new2,1))
          PY
          node --check password-access.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add password-access.js schools.html
          if git diff --cached --quiet; then
            echo 'Cache versions already refreshed.'
            exit 0
          fi
          git commit -m 'Refresh stabilized student tab assets'
          git push origin HEAD:main
