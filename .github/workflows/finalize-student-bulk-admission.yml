name: Finalize Student Bulk Admission No

on:
  push:
    paths:
      - '.github/workflows/finalize-student-bulk-admission.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bulk upload finalisation
        run: python3 scripts/finalize-student-bulk-admission.py
      - name: Validate JavaScript
        run: |
          node --check bulk-upload.js
          node --check bulk-upload-plus.js
          node --check password-access.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bulk-upload.js bulk-upload-plus.js password-access.js schools.html
          if git diff --cached --quiet; then
            echo 'Bulk upload flow already final.'
          else
            git commit -m 'Finalize class-wise student bulk Admission No flow'
            git push origin HEAD:main
          fi
