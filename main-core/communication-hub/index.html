<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONE Communication Hub V1</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4f6fa;color:#17213a}.app{height:100vh;display:grid;grid-template-columns:240px 360px 1fr}.nav{background:#071b52;color:white;padding:22px}.brand{font-size:22px;font-weight:900}.brand small{display:block;font-size:10px;letter-spacing:.18em;color:#d7b25b;margin-top:5px}.workspace{margin-top:28px;padding:12px;border:1px solid #284177;border-radius:12px}.menu{margin-top:22px;display:grid;gap:8px}.menu button{border:0;background:transparent;color:#dbe5ff;text-align:left;padding:11px;border-radius:9px;font-weight:700}.menu .active{background:#17366f;color:#fff}.list{background:#fff;border-right:1px solid #dde3ee;display:flex;flex-direction:column}.list-head{padding:20px;border-bottom:1px solid #e5e9f1}.list-head h2{margin:0 0 12px}.search{width:100%;padding:11px;border:1px solid #d9dfeb;border-radius:10px}.threads{overflow:auto}.thread{padding:15px 18px;border-bottom:1px solid #edf0f5;cursor:pointer}.thread:hover,.thread.active{background:#f0f5ff}.thread-top{display:flex;justify-content:space-between;gap:8px}.name{font-weight:850}.time{font-size:11px;color:#7a8498}.preview{font-size:12px;color:#697386;margin-top:6px}.badges{margin-top:8px;display:flex;gap:5px}.badge{font-size:9px;font-weight:850;padding:4px 7px;border-radius:999px;background:#e9f8ef;color:#137a40}.badge.ai{background:#eee9ff;color:#6040aa}.chat{display:grid;grid-template-rows:auto 1fr auto;background:#f7f9fc}.chat-head{padding:17px 22px;background:#fff;border-bottom:1px solid #e4e8f0;display:flex;justify-content:space-between}.chat-title b{display:block}.chat-title span{font-size:11px;color:#768095}.actions button{border:1px solid #dce2ec;background:#fff;border-radius:9px;padding:8px 10px;font-weight:750;color:#071b52}.messages{padding:24px;overflow:auto}.bubble{max-width:68%;padding:12px 14px;border-radius:15px;margin:10px 0;font-size:13px;line-height:1.45}.incoming{background:#fff;border:1px solid #e0e5ee}.outgoing{margin-left:auto;background:#dff5e7}.ai-card{margin:18px 0 18px auto;max-width:72%;border:1px solid #d8cdfb;background:#f6f2ff;border-radius:14px;padding:13px}.ai-card b{color:#5d3ba3;font-size:11px}.ai-card p{font-size:12px;margin:7px 0}.ai-card button{border:0;border-radius:8px;padding:7px 10px;font-weight:800;margin-right:5px}.approve{background:#071b52;color:#fff}.edit{background:#fff;color:#071b52}.composer{background:#fff;border-top:1px solid #e2e7ef;padding:14px 20px;display:grid;grid-template-columns:1fr auto;gap:10px}.composer textarea{resize:none;border:1px solid #d9e0eb;border-radius:11px;padding:11px;min-height:48px}.send{border:0;background:#071b52;color:#fff;border-radius:11px;padding:0 22px;font-weight:850}.status{font-size:10px;color:#68758b;margin-top:5px}@media(max-width:900px){.app{grid-template-columns:80px 300px 1fr}.nav{padding:15px 9px}.brand{font-size:13px}.workspace,.menu button{font-size:0}.menu button:before{content:'•';font-size:22px}}@media(max-width:650px){.app{grid-template-columns:1fr}.nav,.list{display:none}.bubble,.ai-card{max-width:88%}}</style></head><body><main class="app"><aside class="nav"><div class="brand">USHA ONE<small>COMMUNICATION HUB</small></div><div class="workspace"><b>Neo School India</b><div class="status">Pilot workspace · V1</div></div><div class="menu"><button class="active">Unified Inbox</button><button>Contacts & Leads</button><button>Follow-ups</button><button>Tasks</button><button>AI Agent</button><button>Settings</button></div></aside><section class="list"><div class="list-head"><h2>Unified Inbox</h2><input class="search" placeholder="Search conversations"></div><div class="threads"><div style="padding:20px">Loading inbox…</div></div></section><section class="chat"><header class="chat-head"><div class="chat-title"><b>Conversation</b><span>Select a conversation</span></div><div class="actions"><button>Lead</button> <button>Follow-up</button> <button>Task</button></div></header><div class="messages"></div><footer class="composer"><textarea placeholder="Type a reply..."></textarea><button class="send">Send</button></footer></section></main><script type="module" src="./app.js"></script></body></html>
