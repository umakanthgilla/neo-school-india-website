name: Package Latest Worker Delete

on:
  push:
    paths:
      - '.github/workflows/package-latest-worker-delete.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare package
        run: |
          mkdir -p package
          cp worker/neo-lead-crm-api-worker-transport-phase1.js package/
          cat > package/README.txt <<'EOF'
          Neo School India latest Worker.
          Includes gate photo support plus visitor retention/delete controls.
          Use neo-lead-crm-api-worker-transport-phase1.js in the existing Cloudflare Worker neo-lead-crm-api.
          Do not create a new Worker or D1 database.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: NEO_LATEST_WORKER_VISITOR_CLEANUP
          path: package/
          retention-days: 1
