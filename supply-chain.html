<style>
:root{font-family:Inter,system-ui,sans-serif;--navy:#071b52;--blue:#118be8;--green:#259447;--gold:#f4c400;--neo-gradient:linear-gradient(90deg,#00a7d9 0%,#43b75e 30%,#f5d600 53%,#ff8b30 73%,#ed3889 100%);--ink:#13213c;--muted:#687891;--line:#dce6f2;--bg:#f4f7fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#071b52,#0b397f)}.login-card{width:min(430px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 25px 70px #00102b66}.login-card img{width:170px}.login-card h1{color:var(--navy);margin:18px 0 5px}.login-card p{color:var(--muted)}label{display:grid;gap:6px;font-size:12px;font-weight:750;color:var(--navy);margin:11px 0}input,select,textarea{width:100%;border:1px solid #cbd8e8;border-radius:10px;padding:11px;background:#fff;color:var(--ink)}textarea{min-height:80px;resize:vertical}button{border:0;border-radius:10px;background:var(--navy);color:#fff;padding:11px 15px;font-weight:850}button.secondary{background:#eaf2ff;color:var(--navy)}button:disabled{opacity:.55}.login-card button{width:100%;margin-top:8px}.error{color:#a22b21;white-space:pre-wrap}.topbar{position:sticky;top:0;z-index:10;background:#fff;border-top:4px solid transparent;border-image:var(--neo-gradient) 1;border-bottom:1px solid var(--line)}.topbar-in{max-width:1500px;margin:auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:13px}.brand img{width:145px}.brand b{display:block;color:var(--navy);font-size:17px}.brand span{font-size:11px;color:var(--muted)}.top-actions{display:flex;gap:8px;align-items:center}.badge{border-radius:999px;background:#eef5ff;padding:8px 11px;font-size:11px;font-weight:900;color:var(--navy)}.shell{display:grid;grid-template-columns:255px minmax(0,1fr);max-width:1500px;margin:auto}.side{min-height:calc(100vh - 88px);background:#071b52;padding:20px 14px;position:sticky;top:88px;align-self:start;overflow:hidden}.side:before{content:"";display:block;height:4px;border-radius:9px;background:var(--neo-gradient);margin:0 5px 15px}.side button{position:relative;display:grid;grid-template-columns:34px 1fr;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;color:#dce8ff;margin:4px 0;padding:9px 12px;border-radius:12px;overflow:hidden}.side button:after{content:"";position:absolute;right:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#00a7d9 0%,#43b75e 30%,#f5d600 53%,#ff8b30 73%,#ed3889 100%);transform:scaleY(0);transition:.2s}.side button:hover{background:#ffffff12}.side button.active{background:#fff;color:var(--navy);box-shadow:0 8px 20px #00113c55}.side button.active:after{transform:scaleY(1)}.nav-icon{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#ffffff14;font-size:16px}.side button.active .nav-icon{background:linear-gradient(135deg,#e9f5ff,#fff7ca)}.nav-label{line-height:1.15}.main{padding:28px;min-width:0}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end}.hero h1{margin:0;color:var(--navy);font-size:clamp(28px,4vw,44px)}.hero p{margin:5px 0;color:var(--muted)}.status{min-height:24px;color:#176d36;font-size:13px;margin:10px 0}.stats,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stats article,.card,.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px}.stats article{position:relative;overflow:hidden}.stats article:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--neo-gradient)}.stats span{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:850}.stats strong{display:block;color:var(--navy);font-size:25px;margin-top:5px}.panel{margin:16px 0}.panel h2,.panel h3,.card h3{color:var(--navy);margin-top:0}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.fields label{margin:0}.cards{display:grid;gap:10px}.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}.card h3{margin-bottom:5px}.card p{color:var(--muted);font-size:12px;margin:4px 0}.right{text-align:right}.pill{display:inline-flex;border-radius:999px;padding:5px 9px;background:#eaf2ff;color:#174d92;font-size:10px;font-weight:900}.pill.pending{background:#fff1cc;color:#6e4d00}.pill.done{background:#eaf9ee;color:#16743a}.pill.overdue{background:#ffe6e3;color:#9a251d}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.empty{color:var(--muted);padding:18px}.tab-title{display:flex;justify-content:space-between;gap:14px;align-items:center}.money{font-size:17px;color:var(--navy)}.kit-builder{grid-column:1/-1;border:1px solid var(--line);border-radius:14px;padding:14px;background:#f8fbff}.kit-builder-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.kit-builder-head h3{margin:0}.kit-row{display:grid;grid-template-columns:38px minmax(190px,2fr) 70px 110px 120px 130px 130px 110px 42px;gap:8px;align-items:end;margin-top:9px}.kit-row label{font-size:10px}.kit-item-no{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;align-self:center;background:var(--navy);color:#fff;font-weight:900}.kit-line-total{padding:11px 4px;color:var(--navy);font-weight:900}.remove-item{padding:10px;background:#fff0ee;color:#9a251d}.kit-total{margin-top:12px;padding:13px;border-radius:12px;background:linear-gradient(90deg,#eaf5ff,#fff8cf);color:var(--navy);font-size:18px;font-weight:900}@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{position:static;min-height:auto;display:flex;overflow:auto}.side:before{display:none}.side button{min-width:max-content;grid-template-columns:30px 1fr}.stats,.grid{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr 1fr}.kit-row{grid-template-columns:38px 1.5fr 70px 100p <body>
<section id="login" class="login"><form id="loginForm" class="login-card"><img src="/neo-top-logo.jpeg" alt="Neo School India"><h1>Supply Chain CRM</h1><p>Private Head Office procurement, warehouse and fulfillment workspace.</p><label>Head Office password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><p id="loginError" class="error"></p></form></section>
<div id="app" class="hidden"><header class="topbar"><div class="topbar-in"><div class="brand"><img src="/neo-top-logo.jpeg" alt="Neo School India"><div><b>Head Office Supply Chain</b><span>Center demand · Vendors · Warehouse · Dispatch</span></div></div><div class="top-actions"><span class="badge">Private Operations</span><button id="refresh" class="secondary">Refresh</button><button id="logout" class="secondary">Logout</button></div></div></header><div class="shell"><nav class="side" id="nav"></nav><main class="main"><div class="hero"><div><h1 id="pageTitle">Supply Chain Dashboard</h1><p id="pageSub">One connected flow from center order to delivery.</p></div></div><div id="status" class="status" role="status"></div><div id="content"></div></main></div></div>
<script>
const API='https://neo-lead-crm-api.umakanthgilla.workers.dev',tabs=[['dashboard','Dashboard','⌂'],['center_orders','Center Orders','▤'],['demand','Demand Consolidation','∑'],['center_finance','Center Finance','₹'],['vendors','Vendor Master','♟'],['products','Products & Kits','◫'],['vendor_pos','Vendor Purchase Orders','✎'],['warehouse','Warehouse & GRN','▣'],['packing','Packing','▧'],['dispatch','Dispatch & Tracking','➜'],['finance','Vendor Finance','₹']],$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=p=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format((Number(p)||0)/100),today=()=>new Date(Date.now()+330*60000).toISOString().slice(0,10);
let token=sessionStorage.getItem('neo_crm_token')||'',data={},tab='dashboard';
async function api(path,method='GET',body){const r=await fetch(API+path,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})}),b=await r.json().catch(()=>({}));if(r.status===401){signOut();throw Error('Head Office session expired.')}if(!r.ok)throw Error(b.error||'Request failed');return b}
function note(s,bad=false){$('#status').textContent=s;$('#status').style.color=bad?'#a22b21':'#176d36'}function signOut(){token='';sessionStorage.removeItem('neo_crm_token');$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}
$('#loginForm').onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;$('#loginError').textContent='';try{const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:e.target.password.value})}),b=await r.json();if(!r.ok||!b.success)throw Error(b.error||'Login failed');token=b.token;sessionStorage.setItem('neo_crm_token',token);e.target.reset();start()}catch(x){$('#loginError').textContent=x.message;e.submitter.disabled=false}};$('#logout').onclick=signOut;$('#refresh').onclick=load;
function start(){if(typeof renderSupplyNav!=='function'){document.querySelector('#loginError').textContent='Workspace menu could not load. Please reload this page.';return}$('#login').classList.add('hidden');$('#app').classList.remove('hidden');renderSupplyNav();load()}
async function load(){note('Loading connected supply-chain records…');try{const [supply,portal]=await Promise.all([api('/api/supply/dashboard'),api('/api/portal/overview')]);const schools=new Map((portal.schools||[]).map(x=>[x.school_id,x])),nativeKeys=new Set((supply.center_orders||[]).map(x=>x.school_id+'|'+x.id)),portalOrders=(portal.orders||[]).filter(x=>!nativeKeys.has(x.school_id+'|'+x.id)).map(x=>{const school=schools.get(x.school_id)||{};return {...x,item_name:x.item||'Center order',program:x.program||'School-wide',po_no:x.po_no||x.id,received_quantity:Number(x.received_quantity||0),payment_terms:x.payment_terms||'Pending confirmation',total_paise:Number(x.total_paise||0),school_name:school.name||x.school_name||x.school_id,city:school.city||'',record_source:'portal_order'}});const claims=await Promise.allSettled((portal.schools||[]).map(async school=>({school,records:(await api('/api/portal/'+encodeURIComponent(school.school_id)+'/ledger')).records||[]})));const reportedPayments=claims.flatMap(result=>result.status==='fulfilled'?result.value.records.map(payment=>({...payment,school_id:result.value.school.school_id,school_name:result.value.school.name||result.value.school.school_id})):[]);data={...supply,center_orders:[...portalOrders,...(supply.center_orders||[])],reportedPayments,reportedPaymentsLoadFailed:claims.some(result=>result.status==='rejected')};note('✓ Supply-chain records refreshed.');render()}catch(e){note(e.message,true)}}
const stage=o=>o.status==='Submitted'?'Pending approval':o.status==='Delivered'?'Center received':o.status==='Approved'?'Head Office received':o.status;
function head(title,sub){$('#pageTitle').textContent=title;$('#pageSub').textContent=sub;$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function card(title,lines,right=''){return `<article class="card"><div><h3>${esc(title)}</h3>${lines.map(x=>`<p>${x}</p>`).join('')}</div><div class="right">${right}</div></article>`}
function saveForm(id,kind,prepare){const f=$(id);if(!f)return;f.onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;try{const b=Object.fromEntries(new FormData(f));prepare?.(b);await api('/api/supply/'+kind,'POST',b);f.reset();await load();note('✓ Saved successfully.')}catch(x){note(x.message,true);e.submitter.disabled=false}}}
function render(){if(!data.center_orders)return;const c=$('#content');if(tab==='dashboard'){head('Supply Chain Dashboard','Center demand, vendor procurement, central stock, packing and dispatch.');const pending=data.center_orders.filter(x=>x.status==='Submitted').length,openPO=data.vendor_pos.filter(x=>!['Received','Cancelled'].includes(x.status)).length,stock=data.central_stock.reduce((n,x)=>n+Number(x.on_hand||0),0),packed=data.packs.filter(x=>['Packed','Quality Checked'].includes(x.status)).length,openCredit=(data.center_receivables||[]).filter(x=>Number(x.outstanding_paise)>0),overdueCredit=openCredit.filter(x=>x.due_date&&x.due_date<today()),dueSoon=openCredit.filter(x=>x.due_date&&x.due_date>=today()&&x.due_date<=new Date(Date.now()+330*60000+7*86400000).toISOString().slice(0,10)),urgentCredit=[...overdueCredit,...dueSoon].sort((a,b)=>String(a.due_date).localeCompare(String(b.due_date)));c.innerHTML=`<section class="stats"><article><span>Center orders pending</span><strong>${pending}</strong></article><article><span>Open vendor POs</span><strong>${openPO}</strong></article><article><span>Central stock units</span><strong>${stock}</strong></article><article><span>Ready packs</span><strong>${packed}</strong></article></section><section class="panel neo-credit-alert"><div class="tab-title"><div><h2>Center credit due</h2><p>Outstanding center orders needing Head Office follow-up.</p></div><button type="button" class="secondary" id="openCenterFinance">View Center Finance</button></div><div class="stats"><article><span>Overdue centers</span><strong>${overdueCredit.length}</strong></article><article><span>Due in 7 days</span><strong>${dueSoon.length}</strong></article><article><span>Total outstanding</span><strong>${money(openCredit.reduce((sum,x)=>sum+Number(x.outstanding_paise||0),0))}</strong></article></div><div class="cards">${urgentCredit.slice(0,5).map(x=>card(x.school_name,[`${esc(x.order_no||x.receivable_no||'Order')} · Due ${esc(x.due_date)}`,`<span class="pill ${x.due_date<today()?'overdue':'pending'}">${x.due_date<today()?'Overdue':'Due soon'}</span>`],`<strong class="money">${money(x.outstanding_paise)}</strong>`)).join('')||'<p class="empty">No overdue or upcoming credit payments.</p>'}</div></section><section class="panel"><h2>Operations pipeline</h2><div class="grid"><article class="card"><div><h3>1 · Center demand</h3><p>Receive and approve center supply orders.</p></div></article><article class="card"><div><h3>2 · Procurement</h3><p>Aggregate demand and place Vendor POs.</p></div></article><article class="card"><div><h3>3 · Warehouse</h3><p>GRN, quality check and central stock.</p></div></article><article class="card"><div><h3>4 · Fulfillment</h3><p>Pack, dispatch and track delivery.</p></div></article></div></section>`;c.querySelector('#openCenterFinance').onclick=()=>{tab='center_finance';render()};return}
if(tab==='center_orders'){head('Center Supply Orders','Orders received from all Neo School India centers.');c.innerHTML=`<section class="stats"><article><span>Total orders</span><strong>${data.center_orders.length}</strong></article><article><span>Pending approval</span><strong>${data.center_orders.filter(x=>x.status==='Submitted').length}</strong></article><article><span>Head Office received</span><strong>${data.center_orders.filter(x=>x.status==='Approved').length}</strong></article><article><span>Center received</span><strong>${data.center_orders.filter(x=>x.status==='Delivered').length}</strong></article></section><section class="panel"><div class="cards">${data.center_orders.map(o=>card(o.school_name+' · '+o.item_name,[`${esc(o.po_no||o.id)} · ${esc(o.category)} · ${esc(o.program||'School-wide')}`,`Order ${esc(o.quantity)} · Center received ${esc(o.received_quantity||0)} · ${esc(o.payment_terms)}`,`<span class="pill ${o.status==='Submitted'?'pending':o.status==='Delivered'?'done':''}">${esc(stage(o))}</span>`],`<strong class="money">${money(o.total_paise)}</strong>${o.status==='Submitted'?`<div class="toolbar"><button data-center-approve="${esc(o.id)}" data-school="${esc(o.school_id)}" data-source="${esc(o.record_source||'supply_order')}">Receive & Approve</button></div>`:''}`)).join('')||'<p class="empty">No center orders.</p>'}</div></section>`;c.querySelectorAll('[data-center-approve]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const path=b.dataset.source==='portal_order'?'/api/portal/'+encodeURIComponent(b.dataset.school)+'/orders/'+encodeURIComponent(b.dataset.centerApprove):'/api/supply/center-orders/'+encodeURIComponent(b.dataset.school)+'/'+encodeURIComponent(b.dataset.centerApprove);await api(path,'PATCH',{status:'Approved',office_note:'Order received by Head Office Supply Chain'});await load()}catch(x){note(x.message,true);b.disabled=false}});return}
if(tab==='center_finance'){head('Center Finance & Due Reminders','Track credit due dates, online receipts and outstanding balances from centers.');const open=data.center_receivables.filter(x=>Number(x.outstanding_paise)>0),outstanding=open.reduce((n,x)=>n+Number(x.outstanding_paise||0),0),received=data.center_payments.reduce((n,x)=>n+Number(x.amount_paise||0),0),overdue=open.filter(x=>x.due_date<today());c.innerHTML=`<section class="stats"><article><span>Credit / payment records</span><strong>${data.center_receivables.length}</strong></article><article><span>Total outstanding</span><strong>${money(outstanding)}</strong></article><article><span>Payments received</span><strong>${money(received)}</strong></article><article><span>Overdue reminders</span><strong>${overdue.length}</strong></article></section><section class="panel"><h2>Record center payment received</h2><form id="centerPayForm"><div class="fields"><label>Outstanding center order<select name="receivable_id" required><option value="">Choose…</option>${open.map(x=>`<option value="${esc(x.id)}">${esc(x.school_name)} · ${esc(x.order_no)} · ${money(x.outstanding_paise)}</option>`).join('')}</select></label><label>Amount INR<input name="amount" type="number" min=".01" step=".01" required></label><label>Received date<input name="payment_date" type="date" required></label><label>Payment mode<select name="payment_mode"><option>Online payment</option><option>UPI</option><option>Bank transfer</option><option>Cheque</option><option>Cash</option></select></label><label>Transaction / reference<input name="reference" required></label><label>Notes<textarea name="notes"></textarea></label></div><button>Post payment received</button></form></section><section class="panel"><h2>Due tracker & reminders</h2><div class="cards">${[...data.center_receivables].sort((a,b)=>(Number(b.outstanding_paise)>0)-(Number(a.outstanding_paise)>0)||String(a.due_date||'9999').localeCompare(String(b.due_date||'9999'))).map(r=>{const late=Number(r.
