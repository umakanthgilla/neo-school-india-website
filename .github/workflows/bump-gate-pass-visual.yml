name: Refresh Gate Pass Visual Asset

on:
  push:
    paths:
      - '.github/workflows/bump-gate-pass-visual.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump gate pass visual cache key
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('gate-checkin.html')
          s=p.read_text()
          old='/gate-pass-visual.js?v=20260930-pass2'
          new='/gate-pass-visual.js?v=20260930-pass3'
          if old not in s:
              raise SystemExit('gate pass visual tag not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gate-checkin.html
          git commit -m 'Refresh refined gate pass visual asset'
          git push origin HEAD:main
