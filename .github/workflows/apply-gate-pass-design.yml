name: Apply Premium Gate Pass Design

on:
  push:
    paths:
      - '.github/workflows/apply-gate-pass-design.yml'
      - 'scripts/update_gate_pass_design.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply premium gate pass design
        run: python3 scripts/update_gate_pass_design.py
      - name: Syntax check and commit
        run: |
          set -euo pipefail
          node --check /tmp/gate-checkin-inline.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gate-checkin.html
          if git diff --cached --quiet; then
            echo 'Premium gate pass design already applied.'
            exit 0
          fi
          git commit -m 'Redesign Neo digital gate pass'
          git push origin HEAD:main
