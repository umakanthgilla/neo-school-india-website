name: Patch Learning Materials Clarity

on:
  push:
    paths:
      - 'tmp_patch_learning_materials.py'
      - '.github/workflows/patch-learning-materials.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch teacher timetable material/resource messaging
        run: python3 tmp_patch_learning_materials.py
      - name: Validate JavaScript
        run: node --check learning-family.js
      - name: Commit product change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learning-family.js
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
          else
            git commit -m 'Clarify timetable materials and resource linking'
            git push origin HEAD:main
          fi
