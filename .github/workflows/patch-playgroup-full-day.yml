name: Apply Playgroup Full Day

on:
  push:
    paths:
      - '.github/workflows/patch-playgroup-full-day.yml'
      - 'scripts/patch-playgroup-full-day.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply full-day timetable patch
        run: python3 scripts/patch-playgroup-full-day.py

      - name: Validate JavaScript
        run: |
          node --check learning-family.js
          node --check timetable-full-day.js

      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learning-family.js timetable-full-day.js teachers.html schools.html
          if git diff --cached --quiet; then
            echo 'Full-day timetable patch already applied.'
          else
            git commit -m 'Generate Playgroup full-day schedule from curriculum rhythm'
            git push origin HEAD:main
          fi
