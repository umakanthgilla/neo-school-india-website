name: Apply Visitor Facilities Worker Patch

on:
  push:
    paths:
      - '.github/workflows/apply-visitor-facilities.yml'
      - 'worker/visitor-facilities-extension.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert backend extension once
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          target = Path('worker/neo-lead-crm-api-worker-transport-phase1.js')
          extension = Path('worker/visitor-facilities-extension.js').read_text()
          text = target.read_text()
          if 'async function visitorFacilitiesPortal' in text:
              print('Visitor/Facilities backend already applied.')
              raise SystemExit(0)
          anchor = "    const url = new URL(request.url);\n"
          if anchor not in text:
              raise SystemExit('Main Worker URL anchor was not found.')
          call = anchor + "    const visitorFacilitiesResponse = await visitorFacilitiesPortal(request, env, url);\n    if (visitorFacilitiesResponse) return visitorFacilitiesResponse;\n"
          text = text.replace(anchor, call, 1)
          text = text.rstrip() + '\n\n' + extension.strip() + '\n'
          target.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/neo-lead-crm-api-worker-transport-phase1.js
          if git diff --cached --quiet; then
            echo 'No Worker changes required.'
            exit 0
          fi
          git commit -m 'Apply visitor gate and facilities backend'
          git push origin HEAD:main
